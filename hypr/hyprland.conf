monitor = eDP-1, 1920x1080@60, 0x0, 1
monitor = HDMI-1, preferred, auto, auto

env = XCURSOR_SIZE,32
env = XCURSOR_THEME,zhao

exec-once = hypridle ~/.df/hypr/idle/hypridle.conf
exec-once = wlsunset -T 5000 &
exec-once = hyprctl setcursor zhao 32
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = dbus-update-activation-environment --systemd --all
exec-once = noctalia-shell
exec-once = kitty --hold --single-instance tmux
exec-once = hyprpaper --config ~/.df/hypr/hyprpaper.conf
exec-once = fcitx5 -d
exec = nmcli connection up fh_2f1338_5G passwd-file ~/fh_2f1338_5G

source = ./hyprland/appearance.conf
source = ./hyprland/general.conf
source = ./hyprland/keybinds.conf
source = ./hyprland/rules.conf
